name: Publicar CLUTCHZONE no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar código atualizado
        uses: actions/checkout@v4

      # A partir da Fase 5, o app React (web/) é publicado junto do legado no
      # mesmo GitHub Pages. Ver MIGRATION.md para a arquitetura e o rollback.
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Buildar app React (web/)
        working-directory: web
        # base = subpath do project Pages, para os assets resolverem em
        # /cluchzone-frontend/assets/* mesmo quando o index é servido como 404.html.
        run: |
          npm ci
          npm run build -- --base=/cluchzone-frontend/

      - name: Preparar versão pública
        env:
          BASE_PATH: /cluchzone-frontend
        run: |
          mkdir -p site

          # 1) Legado: html/css/js da raiz + imagens (inalterado desde a Fase 0).
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec cp {} site/ \;
          cp -R images site/images

          # 2) Cache-bust dos refs do legado. Roda ANTES de dobrar o React,
          #    cujos assets já têm hash de conteúdo no nome.
          VERSION="${GITHUB_SHA::12}"
          find site -name '*.html' -exec sed -i -E "s#((src|href)=\"[^\"]+\.(js|css))(\?v=[^\"]*)?\"#\1?v=${VERSION}\"#g" {} +

          # 3) React: assets + favicon; o index vira 404.html (fallback SPA do Pages).
          #    /cluchzone-frontend/pubg não é arquivo → 404 → 404.html = SPA → Router
          #    renderiza a rota. O index.html legado (home) não é tocado.
          cp -R web/dist/assets site/assets
          cp web/dist/favicon.svg site/favicon.svg
          cp web/dist/index.html site/404.html

          # 4) Páginas já migradas (Fase 3/4/7/9/10/11): REMOVER os .html legados do publish.
          #    O Pages resolve /pubg para o arquivo pubg.html se ele existir (pretty
          #    URL), ofuscando a rota React e o fallback SPA. Sem o arquivo, tanto
          #    /pubg quanto /pubg.html caem no 404 → 404.html (SPA) → o Router
          #    renderiza (e pubg.html redireciona para /pubg). A navbar legada, que
          #    aponta para esses .html, passa a cair no React. Ver MIGRATION.md.
          #    index.html (home, Fase 10) entra na mesma regra: sem o arquivo, "/"
          #    também cai no 404 → 404.html → SPA → rota index (HomePage); e
          #    index.html (link relativo usado pelas páginas legadas ainda não
          #    migradas) redireciona para "/" client-side.
          #    csgo.html (CS2, Fase 11b): corte feito quando o Match Center React
          #    passou a cobrir a peça nova da página; campeonatos/equipes já viviam
          #    em /tournaments e /teams.
          rm -f site/pubg.html site/brawlstars.html site/marketplace.html site/seller-erp.html site/passport.html site/index.html site/csgo.html

          touch site/.nojekyll

      - name: Empacotar site para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
